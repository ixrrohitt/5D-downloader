name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]   # UI-only pushes (www/, version.json) need NO new APK
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Android SDK (runner already has it; just accept licenses + get API 34)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk 5D-Downloader.apk
      - name: Verify APK + checksum
        id: apk
        run: |
          sudo apt-get install -y -q apksigner > /dev/null 2>&1 || true
          unzip -tq 5D-Downloader.apk
          apksigner verify --verbose 5D-Downloader.apk || true
          sha256sum 5D-Downloader.apk | tee 5D-Downloader.apk.sha256
          echo "size=$(stat -c%s 5D-Downloader.apk)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: 5D-Downloader-apk, path: 5D-Downloader.apk }
      - name: Publish release (always the same "latest" link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 5D Downloader (latest)
          files: |
            5D-Downloader.apk
            5D-Downloader.apk.sha256
          body: |
            APK size: ${{ steps.apk.outputs.size }} bytes (check this after downloading).
            If Android says "package appears to be invalid", the download is incomplete or you have an older copy
            signed with a different key: re-download, or uninstall the old app first (saved files stay in Downloads).
          make_latest: true
