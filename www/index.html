</style></head><body>
<canvas id="c"></canvas><div id="bglog" aria-hidden="true"></div>
<div class="bar"><div class="mark grad">3·4·5D</div><div class="sp"></div>
 <button class="ib" id="bV" aria-label="vault">⌂</button><button class="ib" id="bC" aria-label="cookies">◍</button><button class="ib" id="bL" aria-label="log">≡</button><button class="ib appOnly" id="bU" aria-label="update">⟳</button><button class="ib" id="bS" aria-label="sound">♪</button></div>

<section class="step on" id="s-paste"><div class="big" data-big>PASTE</div>

 <p class="hint">playlists · many links · drag &amp; drop</p><div class="err" id="fErr"></div></section>
<section class="step" id="s-fetch"><div class="big" data-big>READ</div><p class="hint" id="fS">connecting</p><button class="lnk" id="cancelF">✕ cancel</button></section>
<section class="step" id="s-choose"><div class="big" data-big>PICK</div><h2 class="t2" id="cT"></h2><p class="hint" id="cM"></p>
 <div class="cards" id="cards"></div>
 <div class="tiles" id="tiles">
  <button class="tile on" data-v="video"><svg viewBox="0 0 24 24"><rect x="2.5" y="4.5" width="19" height="15" rx="3.5"/><path d="M10 9.2v5.6l4.6-2.8z"/></svg><b>Video</b><small id="tV">MP4</small></button>
  <button class="tile" data-v="audio"><svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4.5" height="6.5" rx="2"/><rect x="16.5" y="14" width="4.5" height="6.5" rx="2"/></svg><b>Audio</b><small id="tA">MP3</small></button></div>
 <div class="chips" id="chips"></div>
 <div class="usage" id="usage"></div>
 <button class="launch mag" id="goD"><span class="lt"><b>Download</b><small id="lsz">—</small></span><i class="la">→</i></button><button class="lnk" id="back">← new link</button></section>
<section class="step" id="s-prog"><div id="pnum" data-big>0%</div><h2 class="t2" id="pT">Downloading</h2><p class="hint" id="pS"></p><p class="hint small" id="pF"></p><button class="pill cancel mag" id="cancel">✕ CANCEL</button></section>
<section class="step" id="s-done"><div class="big" data-big>DONE</div><div class="dl" id="links"></div><button class="pill mag" id="again">+ ANOTHER</button></section>

<div class="shade" id="shade"></div>
<aside class="sheet" id="sh-V"><h3>Vault</h3><div id="lib"></div></aside>
<aside class="sheet" id="sh-C"><h3>Cookies</h3><label class="drop" for="cf">drop cookies.txt here<br><small>optional · fixes “confirm you’re not a bot”</small><input type="file" id="cf" accept=".txt" hidden></label></aside>
<aside class="sheet" id="sh-U"><h3>Update</h3><div id="updBody"></div></aside>
<aside class="sheet" id="sh-L"><h3>Log</h3><pre id="log"></pre></aside>
<div class="toast" id="toast"></div>
<script>
(()=>{"use strict";if(!window.Android)return;const A=window.Android,$=s=>document.querySelector(s),realFetch=window.fetch.bind(window);
document.body.classList.add("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const J=(o,c=200)=>new Response(JSON.stringify(o),{status:c,headers:{"Content-Type":"application/json"}});
/* size/estimate logic (same as the PC server) */
const EST={144:19e3,240:37e3,360:62e3,480:112e3,720:225e3,1080:437e3},none=c=>!c||c==="none";
const fsz=(f,d)=>{let s=f.filesize||f.filesize_approx;if(!s&&f.tbr&&d)s=f.tbr*125*d;return s?Math.round(s):0};
function sizesOf(fm,d){let ba=null,bs=-1;for(const f of fm)if(none(f.vcodec)&&!none(f.acodec)){const k=(f.ext==="m4a"?1e6:0)+(f.abr||0);if(k>bs){bs=k;ba=f}}
 const asz=ba?fsz(ba,d):0,by={};for(const f of fm){const h=f.height;if(!h||none(f.vcodec))continue;const z=fsz(f,d);if(!z)continue;const k=(f.ext==="mp4"?1e15:0)+z;if(!by[h]||k>by[h][0])by[h]=[k,z+(none(f.acodec)?asz:0)]}
 const o={};for(const h in by)o[h]=by[h][1];return o}
function entry(i,url){const d=i.duration,th=i.thumbnail||(i.thumbnails&&i.thumbnails.length?i.thumbnails[i.thumbnails.length-1].url:null);let sizes=sizesOf(i.formats||[],d),est=false;
 if(!Object.keys(sizes).length&&d){sizes={};for(const h in EST)sizes[h]=Math.round(d*EST[h]);est=true}
 return{title:i.title||url||"(untitled)",url:i.webpage_url||url,duration:d,thumbnail:th,sizes,est,audio:d?Math.round(d*24000):null}}
const cache={};
function buildProbe(j){if(cache[j.id])return cache[j.id];const raws=j.raw||[],videos=[];let title="video",hs=null;
 if(j.mode==="multiple"){raws.forEach((r,i)=>{let e;try{e=entry(JSON.parse(r),j.urls[i])}catch(_){e={title:j.urls[i],url:j.urls[i],duration:null,thumbnail:null,sizes:{},est:false,audio:null}}videos.push(e)});title=videos.length+" videos";const s=new Set();videos.forEach(v=>Object.keys(v.sizes).forEach(h=>s.add(+h)));hs=[...s].sort((a,b)=>a-b)}
 else{const info=JSON.parse(raws[0]);title=info.title||"video";
  if(j.mode==="playlist"||info.entries){for(const e of(info.entries||[]).slice(0,200)){if(!e)continue;let u=e.url||e.webpage_url||"";if(u&&!u.startsWith("http"))u="https://www.youtube.com/watch?v="+u;videos.push(entry(e,u))}}
  else{videos.push(entry(info,j.urls[0]));hs=[...new Set((info.formats||[]).filter(f=>f.height&&f.vcodec!=="none").map(f=>f.height))].sort((a,b)=>a-b)}}
 return cache[j.id]={title,is_playlist:j.mode==="playlist",videos,resolutions:hs&&hs.length?hs:[144,240,360,480,720,1080],mode:j.mode,urls:j.urls}}
/* /api/* → on-device engine (same contract as the PC server, so the UI is identical) */
window.fetch=async(url,o={})=>{const u=typeof url==="string"?url:url.url;if(!u.startsWith("/api/"))return realFetch(url,o);const m=(o.method||"GET").toUpperCase(),b=o.body;

  if(u==="/api/probe"&&m==="POST"){const d=JSON.parse(b);return J({job_id:A.startProbe(d.url||"",d.cookies_file||"")})}
  if(u.startsWith("/api/job/")){const s=A.getJob(u.split("/").pop());if(!s)return J({error:"unknown job"},404);const j=JSON.parse(s);if(j.kind==="probe"&&j.status==="probe_done")j.probe=buildProbe(j);delete j.raw;return J(j)}
  if(u==="/api/download"&&m==="POST")return J({job_id:A.startDownload(b)});
  if(u==="/api/cancel"&&m==="POST"){A.cancel(JSON.parse(b).job_id);return J({ok:true})}
  if(u==="/api/files"&&m==="GET")return J({files:JSON.parse(A.listFiles())});

 }catch(e){return J({error:String(e&&e.message||e)},500)}
 return J({error:"not found"},404)};
document.addEventListener("click",e=>{const a=e.target.closest("[data-uri]");if(a){e.preventDefault();A.open(a.dataset.uri);return}const s=e.target.closest("[data-share]");if(s){e.preventDefault();A.share(s.dataset.share)}});
/* updates straight from GitHub: UI script (OTA) + yt-dlp engine */
const RAW="https://raw.githubusercontent.com/ixrrohitt/5D-downloader/main/";let latest=null,toasted=false;
async function check(){try{const r=await realFetch(RAW+"version.json?t="+Date.now(),{cache:"no-store"});latest=await r.json()}catch(_){latest=null}render();return latest}
function render(){const cur=+A.localVersion(),apk=+A.apkVersion(),nu=latest&&latest.version>cur,na=latest&&latest.apk_version>apk,b=$("#updBody");if(!b)return;
 $("#bU").classList.toggle("new",!!(nu||na));if((nu||na)&&!toasted&&window.__toast){toasted=true;window.__toast("Update available — tap ⟳")}
 b.innerHTML=`<p class="hint">script v${cur} · app build ${apk} · engine ${esc(A.engineVersion())}</p>`+(latest?(nu?`<p class="t2">v${latest.version} available</p><p class="hint small" style="white-space:normal">${esc(latest.notes||"")}</p><button class="pill" id="uGo">UPDATE NOW</button>`:`<p class="t2">You’re up to date ✓</p>`):`<p class="hint">couldn’t reach GitHub</p>`)+(na?`<button class="pill" id="uApk">NEW APP BUILD ↗</button>`:"")+`<button class="pill" id="uEng">UPDATE YT-DLP ENGINE</button><button class="lnk" id="uChk">check again</button><br><button class="lnk" id="uRst">reset to bundled UI</button>`;
 const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};on("#uGo",apply);on("#uApk",()=>A.openUrl("https://github.com/ixrrohitt/5D-downloader/releases/latest"));on("#uEng",engine);on("#uChk",check);on("#uRst",()=>{A.resetOta();A.reload()})}

document.addEventListener("paste",e=>{const t=(e.clipboardData||window.clipboardData).getData("text");if(S.step==="paste"&&e.target.id!=="url"&&/https?:\/\//.test(t)){e.preventDefault();feed(t)}});
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f&&/\.txt$/i.test(f.name))return upCookie(f);if(S.step==="paste")feed(e.dataTransfer.getData("text/uri-list")||e.dataTransfer.getData("text/plain"))});
function reset(){tok++;logOff();S.probe=null;S.busy=false;S.target=0;S.disp=0;$("#url").value="";$("#fErr").textContent="";phase("idle");document.title="3·4·5D downloader";go("paste")}
$("#back").onclick=reset;$("#again").onclick=reset;
$("#goD").onclick=async()=>{if(!S.probe||S.busy)return;const p=S.probe,ix=selIdx();if(!ix.length){toast("pick at least one");return}
 let urls,pi="";if(p.mode==="playlist"){urls=[p.urls[0]];pi=rng(ix)}else urls=ix.map(i=>p.videos[i].url).filter(Boolean);
 S.busy=true;S.disp=0;S.target=1;cancelReset();$("#pT").textContent="Downloading";phase("download");go("prog");
 try{const{job_id}=await api("/api/download",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:p.mode,media_type:S.media,resolution:S.res,urls,playlist_items:pi,total_items:ix.length,title:p.title,cookies_file:S.cookie})});
  S.job=job_id;try{localStorage.setItem("ytdl_job",job_id)}catch(_){}poll(job_id,"dl")}
 catch(e){fail(e.message,"choose")}};
async function upCookie(f){if(!f)return;const fd=new FormData();fd.append("file",f);try{const j=await api("/api/cookies",{method:"POST",body:fd});S.cookie=j.cookies_file;toast("cookies loaded");chord([600,900]);sheet(null)}catch(e){toast(e.message)}}
$("#cf").onchange=e=>upCookie(e.target.files[0]);
async function refreshLib(){try{const f=(await api("/api/files")).files||[];$("#lib").innerHTML=f.length?f.map(x=>`<div class="li"><div class="n">${esc(x.name)}<br><small style="color:var(--mu)">${x.size_mb} MB</small></div>${x.uri?`<a href="#" data-uri="${esc(x.uri)}">OPEN</a><a href="#" data-share="${esc(x.uri)}">SHARE</a>`:`<a href="${x.url}" download>SAVE</a>`}<button data-p="${esc(x.path)}">RM</button></div>`).join(""):'<p class="hint">empty</p>';
 $$("#lib button").forEach(b=>b.onclick=async()=>{if(!confirm("Delete "+b.dataset.p+"?"))return;try{await fetch("/api/files",{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:b.dataset.p})});refreshLib()}catch(e){toast(e.message)}})}catch(e){}}
/* ===== data-usage estimates ===== */
const fb=b=>!b?"—":b>=1073741824?(b/1073741824).toFixed(2)+" GB":b>=1048576?(b/1048576).toFixed(b>=1e8?0:1)+" MB":Math.max(1,b/1024|0)+" KB";
function vSize(v,res){const s=v.sizes||{},hs=Object.keys(s).map(Number).sort((a,b)=>a-b);if(!hs.length)return null;const k=!res?hs[hs.length-1]:(hs.filter(x=>x<=res).pop()||hs[0]);return s[k]||null}
function total(res,media){let sum=0,unk=0,est=false;for(const i of selIdx()){const v=S.probe.videos[i],z=media==="audio"?v.audio:vSize(v,res);if(z){sum+=z;if(v.est||media==="audio")est=true}else unk++}return{sum,unk,est}}
function updateSizes(){if(!S.probe)return;const n=selIdx().length;
 $$("#chips .ch").forEach(c=>{const t=total(+c.dataset.r,"video");c.querySelector("small").textContent=t.sum?(t.est?"~":"")+fb(t.sum):"—"});
 const tv=total(S.res,"video"),ta=total(0,"audio"),t=S.media==="audio"?ta:tv;
 $("#tV").textContent="MP4 · "+(tv.sum?(tv.est?"~":"")+fb(tv.sum):"size n/a");$("#tA").textContent="MP3 · "+(ta.sum?"~"+fb(ta.sum):"size n/a");
 $("#usage").innerHTML=n?`<b class="grad">${t.sum?(t.est?"≈ ":"")+fb(t.sum):"size unknown"}</b>of data<span> · ${n} ${n>1?"files":"file"} · ${S.media==="video"?(S.res?S.res+"p":"best quality"):"192 kbps"}${t.unk?" · "+t.unk+" unknown":""}</span>`:"nothing selected";
 $("#lsz").textContent=n&&t.sum?(t.est?"≈ ":"")+fb(t.sum)+" · "+(S.media==="video"?"video":"audio"):n?"size unknown":"pick something"}
/* ===== ambient log: low-opacity background, fades away when the process ends ===== */
const bg=$("#bglog");let bgLast="",bgOff=0;
function logBg(l){if(!l||!l.length)return;clearTimeout(bgOff);bg.classList.add("on");
 const sig=x=>x.time+x.message;let from=-1;if(bgLast){for(let i=l.length-1;i>=0;i--)if(sig(l[i])===bgLast){from=i;break}}
 if(from<0)bg.innerHTML="";const fresh=(from<0?l.slice(-9):l.slice(from+1)).slice(-9);
 for(const x of fresh){const d=document.createElement("div");d.className=x.level||"";d.textContent=String(x.message).replace(/\s+/g," ").slice(0,150);bg.appendChild(d)}
 while(bg.children.length>9)bg.firstChild.remove();bgLast=sig(l[l.length-1])}
function logOff(){clearTimeout(bgOff);bg.classList.remove("on");bgOff=setTimeout(()=>{bg.innerHTML="";bgLast=""},2400)}
/* ===== cancel (double-tap to confirm) ===== */
let cArm=0,cT=0;const cb=$("#cancel");
function cancelReset(){cArm=0;clearTimeout(cT);cb.disabled=false;cb.textContent="✕ CANCEL";cb.classList.remove("arm")}
cb.onclick=async()=>{if(!cArm){cArm=1;cb.textContent="TAP AGAIN TO CANCEL";cb.classList.add("arm");cT=setTimeout(cancelReset,2600);return}
 clearTimeout(cT);cb.disabled=true;cb.textContent="CANCELLING…";try{await api("/api/cancel",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({job_id:S.job})})}catch(e){toast(e.message);cancelReset()}};
$("#cancelF").onclick=()=>reset();
/* resume a running download after a page refresh */
(async()=>{try{const id=localStorage.getItem("ytdl_job");if(!id)return;const j=await api("/api/job/"+id);if(j.kind==="download"&&(j.status==="running"||j.status==="queued")){S.busy=true;S.target=1;S.job=id;$("#pT").textContent="Resuming…";go("prog");poll(id,"dl")}else localStorage.removeItem("ytdl_job")}catch(_){try{localStorage.removeItem("ytdl_job")}catch(__){}}})();
window.__sheet=sheet;window.__toast=toast;
window.__back=()=>{if($(".sheet.on")){sheet(null);return true}if(S.step==="choose"||S.step==="done"){reset();return true}return false};
window.__shared=u=>{if(S.busy){toast("A download is running — share again when it finishes");return}tok++;logOff();S.probe=null;S.target=0;S.disp=0;fetching=false;phase("idle");$("#fErr").textContent="";go("paste");$("#url").value=u;doFetch()};
if(window.Android){try{window.Android.uiReady();const u=window.Android.takeShared();if(u)setTimeout(()=>window.__shared(u),500)}catch(_){}}
$("#url").focus({preventScroll:true});
})();
</script></body></html>
